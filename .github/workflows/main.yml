name: Compilar APK desde ZIP

# ARCHIVO FIJO: no se vuelve a cambiar.
# Sube un .zip con el proyecto y este archivo compila el APK solo.
# Si hay varios .zip, usa el que subiste más recientemente.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar el zip más reciente
        id: zip
        run: |
          ZIP=""
          for f in $(git log --name-only --format= --diff-filter=AM -- '*.zip'); do
            if [ -f "$f" ]; then ZIP="$f"; break; fi
          done
          if [ -z "$ZIP" ]; then echo "No encontré ningún .zip en el repo"; exit 1; fi
          echo "Zip a compilar: $ZIP"
          echo "archivo=$ZIP" >> "$GITHUB_OUTPUT"
          echo "nombre=$(basename "$ZIP" .zip)" >> "$GITHUB_OUTPUT"

      - name: Descomprimir
        id: proyecto
        run: |
          rm -rf proyecto && mkdir proyecto
          unzip -q "${{ steps.zip.outputs.archivo }}" -d proyecto
          RAIZ=$(dirname "$(find proyecto -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)")
          if [ "$RAIZ" = "." ] || [ -z "$RAIZ" ]; then echo "El zip no trae settings.gradle.kts"; exit 1; fi
          echo "Proyecto en: $RAIZ"
          find "$RAIZ" -type f | sort
          echo "raiz=$RAIZ" >> "$GITHUB_OUTPUT"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: ${{ steps.proyecto.outputs.raiz }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.nombre }}-apk
          path: ${{ steps.proyecto.outputs.raiz }}/**/build/outputs/apk/debug/*.apk
