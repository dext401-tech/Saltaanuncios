          # ===== app/src/main/res/drawable/ic_launcher.xml =====
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'FIN_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Icono: círculo rojo con flecha de "saltar" -->
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#C62828"
                  android:pathData="M24,2a22,22 0,1 0,0.01 0z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M14,14 L26,24 L14,34 Z M26,14 L36,24 L26,34 Z" />
          </vector>
          FIN_ARCHIVO

          echo "Proyecto creado:" && find . -type f | sort

      - name: Compilar APK
        working-directory: proyecto
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: SaltaAnuncios-apk
          path: proyecto/app/build/outputs/apk/debug/*.apk
